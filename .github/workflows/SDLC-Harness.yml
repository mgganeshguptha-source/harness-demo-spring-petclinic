name: SDLC-Harness

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id (e.g. BCBSM-1234)"
        required: true
        type: string
      base:
        description: "Dev branch to run against and PR into (e.g. PM_Sep, VoC_Oct). Blank = repo default."
        required: false
        default: ""
        type: string
      resume:
        description: "Continue a halted run from harness-wip/<feature_id> instead of starting over"
        required: false
        default: false
        type: boolean
      start_phase:
        description: "Resume only — phase to re-enter at. Blank = where it halted."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - context
          - design
          - prompt_steps
          - coding
          - code_review
          - unit_testing
          - validation
          - documentation
          - raise_pr

# The reusable engine workflow pushes branches and opens a PR, and makes Copilot
# model calls. A reusable workflow can NEVER hold more permission than its
# caller, so every permission the engine needs must be granted here:
#   contents / pull-requests  -> branches and the PR
#   copilot-requests          -> lets the built-in Actions token pay for Copilot
#                                model calls, billed to the organization. Without
#                                this line the engine job has it set to none and
#                                the Actions-token route cannot work, whatever the
#                                engine declares. It is unnecessary only if you
#                                supply COPILOT_MODEL_TOKEN instead.
permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

jobs:
  harness:
    uses: YOUR-ORG/SDLC-Harness/.github/workflows/harness.yml@v1
    with:
      feature_id: ${{ inputs.feature_id }}
      base: ${{ inputs.base }}
      java-version: "17"
      python-version: "3.13"
      node-version: "20"
      resume: ${{ inputs.resume }}
      start_phase: ${{ inputs.start_phase }}
      # engine_ref defaults to v1 (a tag, so branch naming does not matter).
      # toolkit_ref defaults to 'main' — set it when the toolkit repo's default
      # branch is named differently (BCBSM repos use 'master').
      toolkit_ref: master
    secrets:
      # Repo access: checkout of the engine + toolkit, git push, gh pr create,
      # and credit reporting. A classic PAT is acceptable here.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      # Copilot model access. LEAVE THIS LINE COMMENTED OUT to use the built-in
      # Actions token (the `copilot-requests: write` route above). Uncomment and
      # add the secret only when that route is unavailable — and note that a
      # CLASSIC PAT (ghp_) is NOT accepted by Copilot for model calls; use an
      # OAuth login token (gho_), a GitHub App user token (ghu_), or a
      # fine-grained PAT with the "Copilot Requests" permission (github_pat_).
      # COPILOT_MODEL_TOKEN: ${{ secrets.COPILOT_MODEL_TOKEN }}
