name: SDLC-Harness

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id (e.g. BCBSM-1234)"
        required: true
        type: string
      base:
        description: "Dev branch to run against and PR into (e.g. PM_Sep, VoC_Oct). Blank = repo default."
        required: false
        default: ""
        type: string
      resume:
        description: "Continue a halted run from harness-wip/<feature_id> instead of starting over"
        required: false
        default: false
        type: boolean
      start_phase:
        description: "Resume only — phase to re-enter at. Blank = where it halted."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - context
          - design
          - prompt_steps
          - coding
          - code_review
          - unit_testing
          - validation
          - documentation
          - raise_pr

# The reusable engine workflow pushes branches and opens a PR. A reusable
# workflow can never exceed the permissions granted here by the caller, so these
# must be present or the engine job is denied (contents: read, pull-requests: none).
permissions:
  contents: write
  pull-requests: write

jobs:
  harness:
    uses: mgganeshguptha-source/harness-engine/.github/workflows/harness.yml@v1
    with:
      feature_id: ${{ inputs.feature_id }}
      base: ${{ inputs.base }}
      java-version: "17"
      python-version: "3.13"
      node-version: "20"
      resume: ${{ inputs.resume }}
      start_phase: ${{ inputs.start_phase }}
      # engine_ref defaults to v1; toolkit_ref defaults to main — no need to set.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
